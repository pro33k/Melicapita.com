<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptops - Milecapita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-tomato { background-color: #FF6347; }
        .text-tomato { color: #FF6347; }
        .border-tomato { border-color: #FF6347; }
        .bg-tomato-light { background-color: #FFF0EB; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes bounceShort {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.15); }
        }
        .animate-bounce-short {
            animation: bounceShort 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes shimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
            background-color: #e5e7eb;
        }
        .skeleton-shimmer::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(110deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0.75) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%);
            animation: shimmer 1.3s linear infinite;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.45s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center h-screen font-sans">

    <!-- Main Mobile Container -->
    <div class="w-full max-w-md bg-gradient-to-b from-[#FF6347] via-[#FFA07A] to-white text-gray-900 flex flex-col h-screen overflow-hidden shadow-2xl relative">

        <!-- 📌 TOP HEADER -->
        <header class="flex-shrink-0 flex justify-between items-center py-2 px-3 bg-white/10 backdrop-blur-md z-30 border-b border-white/20 shadow-sm">
            <div class="flex items-center space-x-2">
                <img 
                    src="https://i.ibb.co/wZXxTC0g/ei-1790277686905-removebg-preview.png" 
                    alt="Milecapita Logo" 
                    class="w-10 h-10 object-contain drop-shadow-md"
                >
                <h1 class="font-bold text-base text-white tracking-tight drop-shadow-sm">Milecapita</h1>
            </div>
            
            <!-- TOP RIGHT ICONS -->
            <div class="flex items-center space-x-3">
                <!-- ✨ UPDATED: Notifications bell with badge -->
                <div onclick="openNotifications()" class="relative cursor-pointer transition-transform duration-150 hover:scale-110 active:scale-95">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                    <span id="notifBadge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 bg-red-500 text-white text-[9px] font-bold rounded-full items-center justify-center border border-white">0</span>
                </div>
                
                <a href="account.html" class="cursor-pointer transition-transform duration-150 hover:scale-110 active:scale-95">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </a>
            </div>
        </header>

        <!-- 📜 SCROLLABLE MIDDLE CONTENT -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-4 pb-6">

            <!-- ================= SKELETON LOADER ================= -->
            <div id="skeletonLoader" class="space-y-4">

                <!-- Page title skeleton -->
                <div class="flex justify-between items-center mb-1">
                    <div class="h-5 w-32 rounded skeleton-shimmer"></div>
                    <div class="h-3 w-24 rounded skeleton-shimmer"></div>
                </div>

                <!-- Tabs skeleton -->
                <div class="flex bg-white/40 rounded-xl p-1 border border-white/30 shadow-sm gap-1">
                    <div class="flex-1 h-8 rounded-lg skeleton-shimmer"></div>
                    <div class="flex-1 h-8 rounded-lg skeleton-shimmer"></div>
                    <div class="flex-1 h-8 rounded-lg skeleton-shimmer"></div>
                    <div class="flex-1 h-8 rounded-lg skeleton-shimmer"></div>
                </div>

                <!-- Laptop card skeletons (3 cards) -->
                <div class="flex flex-col gap-4">

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="w-full h-48 skeleton-shimmer"></div>
                        <div class="p-5 space-y-4">
                            <div class="h-2.5 w-24 rounded skeleton-shimmer"></div>
                            <div class="h-7 w-40 rounded skeleton-shimmer"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-14 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-20 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-16 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-24 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                            </div>
                            <div class="h-12 w-full rounded-xl skeleton-shimmer"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="w-full h-48 skeleton-shimmer"></div>
                        <div class="p-5 space-y-4">
                            <div class="h-2.5 w-28 rounded skeleton-shimmer"></div>
                            <div class="h-7 w-44 rounded skeleton-shimmer"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-14 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-20 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-16 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-24 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                            </div>
                            <div class="h-12 w-full rounded-xl skeleton-shimmer"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="w-full h-48 skeleton-shimmer"></div>
                        <div class="p-5 space-y-4">
                            <div class="h-2.5 w-24 rounded skeleton-shimmer"></div>
                            <div class="h-7 w-36 rounded skeleton-shimmer"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-14 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-20 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-100">
                                    <div class="h-2 w-16 mx-auto rounded skeleton-shimmer"></div>
                                    <div class="h-3 w-24 mx-auto rounded skeleton-shimmer"></div>
                                </div>
                            </div>
                            <div class="h-12 w-full rounded-xl skeleton-shimmer"></div>
                        </div>
                    </div>

                </div>

            </div>
            <!-- ================= END SKELETON ================= -->


            <!-- ================= REAL CONTENT ================= -->
            <div id="realContent" class="space-y-4" style="display:none;">

                <!-- Page Title -->
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-lg font-bold text-white drop-shadow-sm">Laptop Store</h2>
                    <span class="text-xs text-white/80 font-medium">Invest & Earn Daily</span>
                </div>

                <!-- ✅ TABS FILTER -->
                <div class="flex bg-gray-200/50 backdrop-blur-md rounded-xl p-1 border border-white/30 shadow-sm">
                    <button onclick="switchTab('Classic')" id="tab-Classic" class="flex-1 py-2 text-[11px] font-bold rounded-lg bg-tomato text-white shadow-sm transition-all duration-300">
                        Classic
                    </button>
                    <button onclick="switchTab('Power')" id="tab-Power" class="flex-1 py-2 text-[11px] font-bold rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-300">
                        Power
                    </button>
                    <button onclick="switchTab('Smart')" id="tab-Smart" class="flex-1 py-2 text-[11px] font-bold rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-300">
                        Smart
                    </button>
                    <button onclick="switchTab('Elite')" id="tab-Elite" class="flex-1 py-2 text-[11px] font-bold rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-300">
                        Elite
                    </button>
                </div>

                <!-- ✅ LAPTOP LIST CONTAINER -->
                <div id="laptopGrid" class="flex flex-col gap-4">
                    <!-- Cards will be dynamically injected here by script.js -->
                </div>

            </div>
            <!-- ================= END REAL CONTENT ================= -->

        </div>

        <!-- 📌 BOTTOM NAVIGATION -->
        <nav class="flex-shrink-0 w-full bg-gray-900 border-t border-gray-800 flex justify-around py-3 pb-safe z-30">
            <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-tomato transition-colors cursor-pointer group">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-medium mt-1">Home</span>
            </a>
            
            <a href="laptops.html" class="flex flex-col items-center text-tomato hover:text-tomato transition-colors cursor-pointer group">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span class="text-[10px] font-medium mt-1">Laptop</span>
            </a>
            
            <a href="team.html" class="flex flex-col items-center text-gray-400 hover:text-tomato transition-colors cursor-pointer group">

                <span class="text-[10px] font-medium mt-1">Team</span>
            </a>
            
            <a href="account.html" class="flex flex-col items-center text-gray-400 hover:text-tomato transition-colors cursor-pointer group">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium mt-1">Account</span>
            </a>
        </nav>

    </div>

    <!-- ================= REVEAL SCRIPT ================= -->
    <script>
        // This function is called by script.js when the app is ready to display content
        window.revealDashboard = function() {
            const skeleton = document.getElementById("skeletonLoader");
            const real = document.getElementById("realContent");

            if (skeleton && skeleton.style.display !== "none") {
                skeleton.style.display = "none";
                real.style.display = "block";
                real.classList.add("fade-in-up");
            }
        };
    </script>
    <!-- ⚙️ CONNECT TO BRAIN SCRIPT -->
    <script type="module" src="script.js"></script>
</body>
</html>
