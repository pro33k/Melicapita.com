<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milecapita Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-tomato { background-color: #FF6347; }
        .text-tomato { color: #FF6347; }
        .border-tomato { border-color: #FF6347; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes bounceShort {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.15); }
        }
        .animate-bounce-short {
            animation: bounceShort 0.4s ease-in-out;
        }

        .loader {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .loader::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background: linear-gradient(110deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0.75) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%);
            animation: shimmer 1.3s linear infinite;
        }

        .loader .wrapper { width: 100%; height: 100%; position: relative; }
        .loader .wrapper > div { background-color: #e5e7eb; }

        .loader .circle {
            width: 60px; height: 60px; border-radius: 50%;
        }
        .loader .line-1 { position: absolute; top: 12px; left: 75px; height: 12px; width: 45%; border-radius: 6px; }
        .loader .line-2 { position: absolute; top: 34px; left: 75px; height: 10px; width: 65%; border-radius: 6px; }
        .loader .line-3 { position: absolute; top: 78px; left: 0; height: 110px; width: 100%; border-radius: 16px; }
        .loader .line-4 { position: absolute; top: 210px; left: 0; height: 56px; width: 100%; border-radius: 14px; }
        .loader .line-5 { position: absolute; top: 280px; left: 0; height: 12px; width: 92%; border-radius: 6px; }
        .loader .line-6 { position: absolute; top: 304px; left: 0; height: 10px; width: 75%; border-radius: 6px; }

        @keyframes shimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.45s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center h-screen font-sans">

    <script>
        window.revealDashboard = function() {
            const skeleton = document.getElementById("skeletonLoader");
            const real = document.getElementById("realContent");

            if (skeleton && skeleton.style.display !== "none") {
                skeleton.style.display = "none";
                real.style.display = "block";
                real.classList.add("fade-in-up");
            }
        };
    </script>
